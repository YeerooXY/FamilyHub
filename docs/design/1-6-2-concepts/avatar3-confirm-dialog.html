<!doctype html>
<html lang="en"><meta charset="utf-8"><title>Confirm dialog: Avatar 3 template</title>
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{width:1920px;height:1080px;position:relative;overflow:hidden;font-family:"Segoe UI",system-ui,sans-serif;color:#f1f4fb;background:#06080f}
.bg{position:absolute;inset:0;background:url("avatar3-backdrop.png") center/cover;filter:blur(14px) brightness(.5) saturate(1.1);transform:scale(1.06)}
.shade{position:absolute;inset:0;background:radial-gradient(900px 600px at 50% 50%,rgba(6,8,15,.1),rgba(6,8,15,.7))}
.panel{position:absolute;left:50%;top:50%;width:1040px;transform:translate(-50%,-50%);padding:34px;border-radius:32px;background:rgba(20,23,37,.88);border:1px solid rgba(160,150,255,.75);box-shadow:0 0 0 1px rgba(255,255,255,.05),0 0 60px rgba(70,200,210,.28),0 0 140px rgba(255,140,60,.22),0 0 220px rgba(120,100,255,.28),0 40px 90px rgba(0,0,0,.55);backdrop-filter:blur(18px)}
.summary{display:grid;grid-template-columns:200px 1fr;gap:0;padding:0;overflow:hidden;border-radius:22px;background:rgba(40,45,70,.72);border:1px solid rgba(255,255,255,.07);min-height:270px}
.poster{width:200px;height:100%;background:url("avatar3-backdrop.png") 38% center/auto 100%;box-shadow:12px 0 30px rgba(0,0,0,.35)}
.info{display:grid;align-content:center;gap:16px;padding:26px 30px}
.line1{display:flex;align-items:center;gap:18px}
.title{font-size:40px;font-weight:700;letter-spacing:.2px}
.year{font-size:28px;font-weight:600;color:#cdd3ea}
.age{width:48px;height:48px;border-radius:50%;border:5px solid #e8b923;background:#15161d;display:grid;place-items:center;font-weight:800;font-size:20px;color:#fff}
.line2{display:flex;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 18px;border-radius:999px;font-size:20px;font-weight:600;background:#2d3352;color:#e6e9f7}
.pill svg{width:20px;height:20px}
.pill.q{background:linear-gradient(135deg,#7a4ff0,#5b2fd0);color:#fff}
.line3{display:flex;gap:30px;align-items:center;font-size:22px;color:#dde2f5}
.line3 span{display:flex;align-items:center;gap:10px}
.hot-green{color:#5fe39a;font-weight:700}.hot-amber{color:#f2c94c;font-weight:700}.hot-orange{color:#ff9a4a;font-weight:700}.hot-red{color:#ff6b6b;font-weight:700}
.dot{width:14px;height:14px;border-radius:50%;background:#3ddc84;box-shadow:0 0 10px #3ddc84}
.rows{display:grid;gap:14px;margin-top:22px}
.row{display:flex;align-items:center;gap:18px;padding:18px 22px;min-height:76px;border-radius:18px;background:rgba(36,40,63,.75);font-size:24px}
.row .label{flex:1}.row small{display:block;color:#a4acd0;font-size:16px;margin-top:2px}
.ico{width:32px;height:32px;stroke:#d5dbf3;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.sw{width:72px;height:40px;border-radius:999px;background:#454b6b;position:relative}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:32px;height:32px;border-radius:50%;background:#fff}
.sw.on{background:#7a5af0}.sw.on::after{left:36px}
.sw.locked{background:#2c7a52}.sw.locked::after{left:36px}
.buttons{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
.btn{height:76px;border-radius:20px;display:flex;align-items:center;justify-content:center;gap:12px;font-size:24px;font-weight:700}
.cancel{background:#2d3352;color:#e3e7f8}
.download{background:linear-gradient(135deg,#8a63ff,#6a3df0);color:#fff;outline:4px solid #fff;outline-offset:3px}
.btn svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.note{position:absolute;left:0;right:0;bottom:16px;text-align:center;font-size:14px;color:#8d96bd}
</style>
<div class="bg"></div><div class="shade"></div>
<div class="panel">
 <div class="summary">
  <div class="poster"></div>
  <div class="info">
   <div class="line1"><span class="title">Avatar: Fire and Ash</span><span class="year">2025</span><span class="age" title="Rated 12">12</span></div>
   <div class="line2">
    <span class="pill"><svg viewBox="0 0 24 24" class="ico" style="width:20px;height:20px"><path d="M11 5 6 9H3v6h3l5 4V5Zm4 4a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></svg>Dolby Atmos 7.1</span>
    <span class="pill q">4K</span>
   </div>
   <div class="line3"><span class="hot-red">38.4 GB</span><span class="hot-red">about 1 h 12 min</span><span><i class="dot"></i>Available</span></div>
  </div>
 </div>
 <div class="rows">
  <div class="row"><svg class="ico" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4V5Zm4 4a4 4 0 0 1 0 6m3-9a8 8 0 0 1 0 12"/></svg><span class="label">Hungarian audio</span><span class="sw"></span></div>
  <div class="row"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5Zm4 5h8M8 13h5"/></svg><span class="label">Hungarian subtitles</span><span class="sw on"></span></div>
  <div class="row"><svg class="ico" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4V5Zm4 5h8M8 13h5"/></svg><span class="label">English subtitles<small>Added automatically</small></span><span class="sw locked"></span></div>
 </div>
 <div class="buttons">
  <div class="btn cancel">Cancel</div>
  <div class="btn download"><svg viewBox="0 0 24 24"><path d="M12 4v11m-5-4 5 5 5-5M5 20h14"/></svg>Download</div>
 </div>
</div>
<div class="note">Template preview with sample data; backdrop art is generated filler.</div>
