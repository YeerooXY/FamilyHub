name: Build private iPhone app

on:
  workflow_dispatch:
    inputs:
      allowance_checked:
        description: 'Confirm the build may use GitHub Actions minutes (free while the repository is public).'
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    if: inputs.allowance_checked
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.401'
      - name: Install iOS workload
        run: |
          dotnet workload install maui-ios --skip-manifest-update
          dotnet workload list
      - name: Build unsigned IPA with a working Xcode
        # .NET for iOS 26.0 asks for Xcode 26.0 exactly, but runners carry simulator runtimes
        # (needed by the asset compiler) only for newer releases, and some installs lack actool.
        # Try each installed Xcode 26.x, newest first, until one builds.
        run: |
          for xcode in $(ls -d /Applications/Xcode_26.*.app | sort -rV); do
            dev="$xcode/Contents/Developer"
            [ -x "$dev/usr/bin/actool" ] || { echo "skip $xcode: no actool"; continue; }
            sudo xcode-select --switch "$dev"
            echo "::group::Build with $xcode"; xcodebuild -version
            if bash scripts/build-ios-app.sh -p:ValidateXcodeVersion=false; then echo "::endgroup::"; echo "Built with $xcode"; exit 0; fi
            echo "::endgroup::"; rm -rf clients/FamilyHub.App/obj clients/FamilyHub.App/bin
          done
          echo "No installed Xcode could build the app." >&2; exit 1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: FamilyHub-Music-unsigned
          path: .local/artifacts/native/ios/FamilyHub-Music-unsigned.ipa
          retention-days: 1
          if-no-files-found: error
