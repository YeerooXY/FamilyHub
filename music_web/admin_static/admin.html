<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>FamilyHub admin</title>
<link rel="stylesheet" href="/admin/admin.css">
<link rel="stylesheet" href="/admin/service-status.css">
</head>
<body>
<main>
  <h1 id="page-title" tabindex="-1">FamilyHub admin</h1>
  <section id="signin" aria-label="Sign in" hidden>
    <form id="signin-form" novalidate>
      <label for="profile">Profile</label>
      <select id="profile"></select>
      <label for="password">Password</label>
      <input id="password" type="password" autocomplete="current-password">
      <p id="signin-error" role="alert"></p>
      <button type="submit" id="signin-submit">Sign in</button>
    </form>
    <div id="signin-outage"></div>
  </section>
  <section id="seeding" aria-label="Torrents" hidden>
    <p id="status" class="muted" role="status"></p>
    <p id="sample-time" class="muted"></p>
    <div id="seeding-outage"></div>
    <div class="boards" id="boards" hidden>
      <section class="board downloads" aria-labelledby="downloads-title">
        <h2 id="downloads-title" tabindex="-1">Downloads</h2>
        <p id="downloads-empty" class="muted" hidden>No downloads in the queue.</p>
        <ul id="download-items" aria-labelledby="downloads-title"></ul>
      </section>
      <section class="board" aria-labelledby="global-title">
        <h2 id="global-title">Seeding</h2>
        <div class="global">
          <p class="figure"><span id="global-ratio"></span>× <small>of <span id="goal"></span>× goal</small></p>
          <div class="meter" role="progressbar" aria-label="Share ratio of current torrents" aria-valuemin="0" aria-valuemax="100" id="global-meter"><i></i></div>
          <p id="global-detail" class="muted"></p>
          <p id="seeding-count" class="muted"></p>
        </div>
        <p id="seeds-empty" class="muted" hidden>No torrents ready to seed.</p>
        <ul id="seed-items" aria-labelledby="global-title"></ul>
      </section>
    </div>
  </section>
</main>
<script type="module" src="/admin/admin.js"></script>
</body>
</html>
