<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"><title>FamilyHub</title><base href="/"><link rel="stylesheet" href="shell.css"><link rel="stylesheet" href="app-native.css"><link rel="stylesheet" href="startup.css"><link rel="stylesheet" href="profile-images.css"><link rel="stylesheet" href="playlist-transfer.css"><link rel="stylesheet" href="server-stats.css"><link rel="stylesheet" href="player-native.css"><link rel="stylesheet" href="paddock-theme.css"><link rel="stylesheet" href="home-mobile.css"><link rel="stylesheet" href="movies.css">
<link rel="stylesheet" href="files.css"><link rel="stylesheet" href="stats-pages.css"><link rel="stylesheet" href="create-playlist.css"><link rel="stylesheet" href="music-admin.css"><link rel="stylesheet" href="popup-native.css"><link rel="stylesheet" href="notices.css"><link rel="stylesheet" href="hub.css"><link rel="stylesheet" href="daily-wordle.css"><link rel="stylesheet" href="feedback.css"><link rel="stylesheet" href="service-status.css"></head>
<body>
<div id="app"><main id="blazor-startup" class="startup-screen" aria-label="Opening FamilyHub" aria-busy="true"><div class="startup-disc"><img src="familyhub-logo.svg" alt="" /></div></main></div>
<span id="blazor-error-announcement" class="sr" role="alert" aria-atomic="true"></span>
<section id="blazor-error-ui" style="display:none" aria-labelledby="blazor-error-title">
    <div class="fh-notice">
        <div class="fh-notice-copy">
            <span class="fh-notice-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5m0-8h.01"/></svg></span>
            <div class="fh-notice-text">
                <h2 id="blazor-error-title">FamilyHub needs to reload</h2>
                <p>Your music queue and settings are kept.</p>
            </div>
        </div>
        <button class="fh-notice-action" type="button">Reload</button>
    </div>
</section>
<script src="paddock-theme.js"></script><script src="notices.js"></script><script src="app.js"></script><script src="_framework/blazor.webview.js" autostart="false"></script>
</body></html>
